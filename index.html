<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#221018" />
    <meta name="description" content="結社遠征錄 — 世界地圖、職業裝備、三章主線 JRPG 小品" />
    <title>結社遠征錄</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div>
          <small>經典 JRPG</small>
          <h1>結社遠征錄</h1>
        </div>
        <button id="sound" type="button" aria-pressed="true">♫ 音效</button>
      </header>

      <section id="lobby" class="panel hero">
        <div class="sigil" aria-hidden="true">✦</div>
        <p>操控結社三人組穿越三章世界地圖：補給、裝備、戰鬥、擊敗首領。</p>
        <p>最佳紀錄 <strong id="best">0</strong></p>
        <button id="start" type="button" class="primary">開始遠征</button>
        <a href="./ATTRIBUTION.md">製作與署名</a>
      </section>

      <section id="game" hidden>
        <div id="hud" class="hud" data-mode="map">
          <span id="chapter">第 1 章</span>
          <span>古幣 <strong id="gold">0</strong></span>
          <span>得分 <strong id="score">0</strong></span>
        </div>

        <div class="stage-wrap">
          <canvas id="map" width="308" height="220" aria-label="世界地圖"></canvas>
          <div id="combat" class="combat" hidden>
            <p>交戰中</p>
            <strong id="enemy-name">敵人</strong>
            <span id="enemy-hp">0 / 0</span>
          </div>
        </div>

        <div id="party" class="party" aria-label="結社成員"></div>
        <p id="msg" class="msg" aria-live="polite"></p>
        <ul id="log" class="log"></ul>

        <div id="shop" class="subpanel" hidden></div>
        <div id="equip-panel" class="subpanel" hidden></div>

        <div class="controls">
          <div class="dpad" aria-label="方向">
            <button id="d-up" type="button" aria-label="向上">↑</button>
            <button id="d-left" type="button" aria-label="向左">←</button>
            <button id="d-down" type="button" aria-label="向下">↓</button>
            <button id="d-right" type="button" aria-label="向右">→</button>
          </div>
          <div id="actions" class="actions"></div>
        </div>
      </section>

      <p id="toast" class="toast" hidden role="status"></p>

      <div id="overlay" class="overlay" hidden inert>
        <div class="overlay-card panel">
          <h2 id="overlay-title">遠征結束</h2>
          <p id="overlay-text"></p>
          <button id="overlay-restart" type="button" class="primary">再開一局</button>
        </div>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
